appId: com.sts.esm
productName: ESM
artifactName: ESM-Setup-${version}.exe
files:
  - "**/*"
  - "!**/.git"
  - "!**/dist/**"
  - "!main.js"
  - "!preload.js"
win:
  target:
    - nsis
  icon: assets/esm-icon-2.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Keep node-llama-cpp's JavaScript package inside app.asar so Node's
# package/ESM resolution can find node-llama-cpp/dist/index.js.
# Only native .node binaries need to live outside ASAR.
asarUnpack:
  - "**/*.node"

extraResources:
  - from: "models"
    to: "models"
