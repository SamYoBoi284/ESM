appId: com.sts.esm
productName: ESM
artifactName: ESM-Setup-${version}.exe
files:
  - "**/*"
  - "!**/.git"
  - "!**/dist/**"
  - "!main.js"
  - "!preload.js"
win:
  target:
    - nsis
  icon: assets/esm-icon-2.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

asarUnpack:
  - "node_modules/node-llama-cpp/**/*"
extraResources:
  - from: "models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
    to: "models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
