appId: com.sts.esm
productName: ESM
artifactName: ESM-Setup-${version}.exe
files:
  - "**/*"
  - "!**/.git"
  - "!**/dist/**"
  - "!main.js"
  - "!preload.js"
win:
  target:
    - nsis
  icon: assets/esm-icon-2.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# node-llama-cpp must be shipped as a complete module tree. Its JavaScript
# entrypoint and package files need to remain available at runtime, while
# its native binaries must be physically outside app.asar.
asarUnpack:
  - "node_modules/node-llama-cpp/**"
  - "node_modules/@node-llama-cpp/**"
  - "**/*.node"

extraResources:
  - from: "models"
    to: "models"
