appId: com.sts.esm
productName: ESM
artifactName: ESM-Setup-${version}.exe
files:
  - "**/*"
  - "!**/.git"
  - "!dist/**"
  - "!main.js"
  - "!preload.js"
win:
  target:
    - nsis
  icon: assets/esm-icon-2.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Keep node-llama-cpp's JavaScript/package tree inside app.asar so the
# normal package import can resolve it. Only native binaries need to live
# outside ASAR.
asarUnpack:
  - "**/*.node"
  - "**/*.dll"

extraResources:
  - from: "models"
    to: "models"
